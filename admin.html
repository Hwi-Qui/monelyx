<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#1769FF;--blue2:#287BFF;--cyan:#00B8FF;--navy:#10264B;--bg:#F7F9FC;--gray:#667085;--line:#E9EEF5;--line2:#EDF1F7;
--green:#0B9A57;--green-bg:#EAF9F0;--amber:#B25E00;--amber-bg:#FFF4E0;--red:#C13515;--red-bg:#FEEBEB;--blue-bg:#EAF1FF;
--sh:0 1px 2px rgba(16,38,75,.05),0 12px 32px -18px rgba(16,38,75,.14);--sh-lg:0 24px 48px -20px rgba(23,105,255,.28)}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--navy);font-size:14.5px;line-height:1.5}
h1,h2,h3,h4{font-family:'Manrope';line-height:1.25}
button{font-family:inherit}
::selection{background:rgba(23,105,255,.18)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#D5DEEC;border-radius:99px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-family:'Manrope';border-radius:12px;padding:10px 16px;font-size:13.5px;cursor:pointer;border:1px solid transparent;transition:.18s;text-decoration:none;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-primary{background:linear-gradient(135deg,#1769FF,#00B8FF);color:#fff;box-shadow:0 8px 18px -8px rgba(23,105,255,.55)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-outline{background:#fff;border-color:#DCE5F2;color:var(--navy)}
.btn-outline:hover{border-color:var(--blue);color:var(--blue);background:#F5F9FF}
.btn-ghost{background:#EEF4FF;color:var(--blue)}
.btn-danger{background:var(--red-bg);color:var(--red)}
.btn-danger:hover{background:#FBD9D3}
.btn-success{background:var(--green-bg);color:var(--green)}
.btn-success:hover{background:#D4F2E2}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:10px}.btn-sm svg{width:14px;height:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none!important}
.icon-btn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--navy);transition:.18s;flex:none}
.icon-btn:hover{border-color:var(--blue);color:var(--blue);background:#F5F9FF}
.icon-btn svg{width:18px;height:18px}
.icon-btn .dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.card{background:#fff;border:1px solid var(--line2);border-radius:18px;box-shadow:var(--sh);padding:20px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;font-family:'Manrope'}
.badge svg{width:11px;height:11px}
.b-green{background:var(--green-bg);color:var(--green)}.b-amber{background:var(--amber-bg);color:var(--amber)}.b-red{background:var(--red-bg);color:var(--red)}.b-gray{background:#EEF2F8;color:var(--gray)}.b-blue{background:var(--blue-bg);color:var(--blue)}.b-navy{background:var(--navy);color:#fff}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;color:#3A4A63;margin-bottom:6px}
.input,select.input,textarea.input{width:100%;padding:11px 13px;border:1.5px solid #E2E9F3;border-radius:12px;font:inherit;font-size:13.5px;background:#FBFCFE;color:var(--navy);transition:.18s}
.input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(23,105,255,.12);background:#fff}
textarea.input{resize:vertical;min-height:70px}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check-line{display:flex;gap:9px;align-items:flex-start;font-size:12.8px;color:#44546B;cursor:pointer}
.check-line input{margin-top:2px;accent-color:var(--blue);width:15px;height:15px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line2);font-size:13px}
.kv:last-child{border:none}.kv .k{color:var(--gray);font-weight:600}.kv .v{font-weight:700;text-align:right;word-break:break-word}
.empty{text-align:center;padding:34px 16px;color:var(--gray)}
.empty svg{width:36px;height:36px;color:#C3CEDD;margin-bottom:9px}
.empty h4{color:var(--navy);margin-bottom:4px}
.empty p{font-size:12.8px;max-width:340px;margin:0 auto}
.info-strip{display:flex;gap:10px;align-items:flex-start;background:#F4F8FE;border:1px solid #E1EBFB;border-radius:13px;padding:12px 14px;font-size:12.5px;color:#44546B}
.info-strip svg{width:16px;height:16px;color:var(--blue);flex:none;margin-top:1px}
.info-strip.warn{background:var(--amber-bg);border-color:#F5E3B8;color:#7A5200}
.info-strip.warn svg{color:var(--amber)}

/* Layout admin */
.adm{min-height:100vh}
.sidebar{position:fixed;top:14px;bottom:14px;left:14px;width:252px;background:#fff;border:1px solid var(--line2);border-radius:22px;box-shadow:var(--sh-lg);display:flex;flex-direction:column;padding:18px 13px;z-index:80}
.sb-logo{display:flex;align-items:center;gap:11px;padding:2px 10px 16px;border-bottom:1px solid var(--line2);margin-bottom:12px}
.sb-mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#10264B,#1769FF);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.sb-mark svg{width:21px;height:21px}
.sb-name{font-family:'Manrope';font-weight:800;font-size:15px}
.sb-tag{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--blue);background:var(--blue-bg);padding:2px 8px;border-radius:99px;display:inline-block;margin-top:2px}
.sb-nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.sb-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;font-weight:700;font-size:13.5px;color:#5B6A80;background:none;border:none;cursor:pointer;transition:.18s;width:100%;text-align:left}
.sb-item svg{width:18px;height:18px}
.sb-item:hover{background:#F2F6FF;color:var(--navy)}
.sb-item.active{background:linear-gradient(135deg,#1769FF,#287BFF);color:#fff;box-shadow:0 8px 16px -7px rgba(23,105,255,.6)}
.sb-item .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.sb-item.active .cnt{background:rgba(255,255,255,.28)}
.sb-user{border-top:1px solid var(--line2);padding-top:12px;margin-top:8px;display:flex;align-items:center;gap:9px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#10264B,#1769FF);color:#fff;font-family:'Manrope';font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.avatar.lg{width:64px;height:64px;font-size:20px}
.sb-user .nm{font-size:12.8px;font-weight:700}
.sb-user .rl{font-size:10.5px;color:var(--gray);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.drawer-back{display:none;position:fixed;inset:0;background:rgba(16,38,75,.45);z-index:75}
.main{margin-left:280px;margin-right:14px;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(247,250,252,.85);backdrop-filter:blur(14px);border-bottom:1px solid rgba(233,238,245,.8)}
.burger{display:none}
.search-wrap{flex:1;max-width:460px;position:relative}
.search-box{display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:9px 14px;transition:.18s}
.search-box:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(23,105,255,.12)}
.search-box svg{width:16px;height:16px;color:#9AA7BB;flex:none}
.search-box input{border:none;outline:none;flex:1;font:inherit;font-size:13.5px;background:none}
.sug{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line2);border-radius:14px;box-shadow:var(--sh-lg);overflow:hidden;z-index:60}
.sug button{display:flex;width:100%;gap:10px;align-items:center;padding:11px 14px;border:none;background:none;cursor:pointer;font-size:13px;text-align:left}
.sug button:hover{background:#F5F9FF}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.av-wrap{position:relative}
.av-btn{border:none;background:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:3px}
.av-menu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line2);border-radius:14px;box-shadow:var(--sh-lg);width:210px;padding:8px;display:none;z-index:70}
.av-menu.open{display:block}
.av-menu button{display:flex;gap:9px;align-items:center;width:100%;padding:10px 12px;border:none;background:none;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;color:var(--navy)}
.av-menu button:hover{background:#F2F6FF}
.av-menu button svg{width:16px;height:16px}
.content{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:22px 18px 40px}
.page{animation:fadeUp .35s ease both}
.pg-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.pg-head h1{font-size:21px;letter-spacing:-.3px}
.pg-head p{color:var(--gray);font-size:12.8px;margin-top:3px}

/* KPI & graphiques */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:13px;margin-bottom:20px}
.kpi{display:flex;gap:13px;align-items:center;background:#fff;border:1px solid var(--line2);border-radius:16px;padding:15px 16px;box-shadow:var(--sh);transition:.2s;cursor:default}
.kpi.link{cursor:pointer}
.kpi.link:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.kpi .ic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.kpi .ic svg{width:20px;height:20px}
.kpi .v{font-family:'Manrope';font-weight:800;font-size:19px;letter-spacing:-.3px}
.kpi .l{font-size:11px;color:var(--gray);font-weight:700}
.grid-2{display:grid;grid-template-columns:1fr;gap:15px}
@media(min-width:900px){.grid-2{grid-template-columns:1fr 1fr}}
.chart-card h3{font-size:14px;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.chart-card h3 svg{width:16px;height:16px;color:var(--blue)}

/* Tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:#8A97AB;padding:9px 11px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:11px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:hover td{background:#F8FAFE}
.tbl .amt{font-family:'Manrope';font-weight:800;white-space:nowrap}
.tbl .muted{color:var(--gray);font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:#5B6A80;cursor:pointer;transition:.18s}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.active{background:linear-gradient(135deg,#1769FF,#287BFF);color:#fff;border-color:transparent}
.pager{display:flex;gap:6px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.pager button{min-width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:12.5px;cursor:pointer;color:#5B6A80}
.pager button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pager button:disabled{opacity:.4;cursor:not-allowed}

/* Divers */
.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.list-row:last-child{border:none}
.lr-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.lr-ico svg{width:18px;height:18px}
.lr-main{flex:1;min-width:0}.lr-main .t{font-weight:700;font-size:13px}.lr-main .s{font-size:11.5px;color:var(--gray);margin-top:1px}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:#DCE4F0;border-radius:99px;transition:.2s;cursor:pointer}
.switch i::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 2px 5px rgba(16,38,75,.25)}
.switch input:checked+i{background:linear-gradient(90deg,#1769FF,#00B8FF)}
.switch input:checked+i::after{left:21px}
.modal-overlay{position:fixed;inset:0;background:rgba(16,38,75,.48);backdrop-filter:blur(5px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s ease}
.modal{background:#fff;border-radius:20px;width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 30px 70px -20px rgba(16,38,75,.5);animation:popIn .26s cubic-bezier(.2,.9,.3,1.15) both}
.modal-wide{max-width:660px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:17px 20px 0}
.modal-head h3{font-size:16px}
.modal-body{padding:15px 20px;overflow-y:auto}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;padding:0 20px 18px;flex-wrap:wrap}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:min(400px,calc(100% - 24px))}
.toast{display:flex;align-items:center;gap:10px;background:#fff;border-radius:13px;padding:12px 15px;box-shadow:0 14px 34px -10px rgba(16,38,75,.3);border:1px solid var(--line2);font-size:13px;font-weight:600;animation:slideDown .3s ease both}
.toast svg{width:18px;height:18px;flex:none}
.t-ok svg{color:var(--green)}.t-err svg{color:var(--red)}.t-info svg{color:var(--blue)}.t-warn svg{color:var(--amber)}
.toast.out{opacity:0;transform:translateY(-8px);transition:.3s}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;position:relative;overflow:hidden;background:radial-gradient(900px 500px at 85% -10%,rgba(23,105,255,.16),transparent),radial-gradient(700px 500px at -10% 110%,rgba(0,184,255,.12),transparent),var(--bg)}
.auth-card{width:100%;max-width:430px;animation:fadeUp .4s ease both}
.score-pill{display:inline-flex;align-items:center;gap:6px;background:#F2F6FF;border-radius:99px;padding:4px 11px;font-size:11.5px;font-weight:800;color:var(--blue)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@media(max-width:1023px){
 .sidebar{top:0;bottom:0;left:0;border-radius:0;width:272px;transform:translateX(-105%);transition:transform .25s}
 body.drawer .sidebar{transform:none}
 body.drawer .drawer-back{display:block}
 .main{margin-left:0;margin-right:0}
 .burger{display:inline-flex}
 .content{padding:16px 14px 60px}
}
</style>
</head>

<div class="drawer-back" onclick="toggleDrawer(false)"></div>
<div id="modal-root"></div>
<div id="toasts"></div>

 if(db.admin_login_logs.filter(l=>l.event==='echec'&&now-new Date(l.date)<5*60000).length>=5){toast('Trop de tentatives. Réessaie dans 5 minutes.','err');return;}

  openModal({title:'Vérification renforcée',body:'<p style="font-size:13px;color:#44546B;margin-bottom:10px">Un code de vérification a été généré pour <b>'+esc(a.email)+'</b>.</p>'

function wdConfirm(id,to){const a=me();if(!can('act.withdrawals'))return;
 const needReason=to!=='payé';const reason=cfReason();
 if(needReason&&reason.length<10){toast('Motif obligatoire (10 caractères min.).','err');return;}
 if(to==='payé'&&!cfChecked()){toast('Confirme le transfert réel.','err');return;}
 let res=null;Store.mutate(db=>{const t=db.wallet_transactions.find(x=>x.id===id&&x.type==='retrait');if(!t){res='introuvable';return;}
  const w=db.wallets.find(x=>x.userId===t.userId);
  if(to==='approuvé'&&t.status==='suspendu'){
   if(!w||w.balance<t.amount){res='solde';return;}
   w.balance-=t.amount;t.status='approuvé';
   db.wallet_transactions.unshift({id:uid(),userId:t.userId,type:'retrait_debit',label:'Réserve de fonds · retrait '+t.ref,amount:t.amount,status:'confirmé',ref:'DB-'+genCode(6),meta:{admin:a.name,reason},date:new Date().toISOString()});}
  else if(to==='payé'&&t.status==='approuvé'){t.status='payé';}
  else if(to==='refusé'&&(t.status==='suspendu'||t.status==='approuvé')){
   if(t.status==='approuvé'&&w){w.balance+=t.amount;
    db.wallet_transactions.unshift({id:uid(),userId:t.userId,type:'retrait_rembourse',label:'Remboursement réserve · retrait '+t.ref,amount:t.amount,status:'confirmé',ref:'RB-'+genCode(6),meta:{admin:a.name,reason},date:new Date().toISOString()});}
   t.status='refusé';}
  else{res='statut';return;}
  t.meta=t.meta||{};t.meta.updatedBy=a.name;t.meta.updatedAt=new Date().toISOString();t.meta.reason=reason;res='ok';});
 if(res==='ok'){audit('retrait_'+to,id,reason,'critical');
  const t=Store.read().wallet_transactions.find(x=>x.id===id);
  userNotify(t.userId,'Retrait '+(to==='payé'?'payé':to==='approuvé'?'approuvé':'refusé'),to==='refusé'?'Motif : '+reason:'Ta demande '+t.ref+' a été mise à jour.','portefeuille');
  closeModal();toast('Retrait mis à jour : '+to+'.','ok','check');render();}
 else{closeModal();toast(res==='solde'?'Solde utilisateur insuffisant.':'Statut invalide : action déjà effectuée ou impossible.','err','lock');render();}}

let _pendCorrection=null;
function correctionSubmit(){if(!can('act.credits')){toast('Action non autorisée.','err','lock');return;}
 const uId=$('#co-user').value,op=$('#co-op').value,amt=Number($('#co-amt').value),reason=$('#co-reason-pre').value.trim();
 const db=Store.read();const u=db.users.find(x=>x.id===uId);const w=db.wallets.find(x=>x.userId===uId);
 if(!u||!w){toast('Utilisateur introuvable.','err');return;}
 if(!amt||amt<=0){toast('Montant invalide.','err');return;}
 if(reason.length<10){toast('Motif obligatoire (10 caractères min.).','err');return;}
 if(op==='-'&&amt>w.balance){toast('Solde insuffisant ('+fmt(w.balance)+' disponibles).','err');return;}
 _pendCorrection={uId,op,amt,reason};
 confirmModal({title:'Confirmer la correction',label:'Appliquer la correction',icon:'coins',danger:op==='-',
  body:'<div class="kv"><span class="k">Utilisateur</span><span class="v">'+esc(u.prenom+' '+u.nom)+'</span></div>'
  +'<div class="kv"><span class="k">Opération</span><span class="v">'+(op==='+'?'Ajout':'Retrait')+' de '+fmt(amt)+' crédits</span></div>'
  +'<div class="kv"><span class="k">Nouveau solde estimé</span><span class="v">'+fmt(op==='+'?w.balance+amt:w.balance-amt)+' crédits</span></div>'
  +'<div class="kv"><span class="k">Motif</span><span class="v">'+esc(reason)+'</span></div>'
  +'<div class="info-strip warn" style="margin-top:12px">'+ic('alert-triangle')+'<span>Cette opération financière est <b>définitive</b> et sera enregistrée avec ton identité ('+esc(me().name)+'), la date et le motif.</span></div>',
  onConfirm:'correctionApplyPending()'});}
function correctionApplyPending(){if(!_pendCorrection)return;const{uId,op,amt,reason}=_pendCorrection;_pendCorrection=null;correctionApply(uId,op,amt,reason);}
function correctionApply(uId,op,amt,reason){const a=me();if(!can('act.credits'))return;
 let ok=false;Store.mutate(db=>{const w=db.wallets.find(x=>x.userId===uId);if(!w)return;
  if(op==='-'&&w.balance<amt)return;
  w.balance+=(op==='+'?amt:-amt);
  db.wallet_transactions.unshift({id:uid(),userId:uId,type:'correction',label:'Correction admin · '+reason,amount:amt,status:'confirmé',ref:'CO-'+genCode(6),meta:{op,admin:a.id,adminName:a.name,reason},date:new Date().toISOString()});
  ok=true;});
 if(ok){audit('correction_credits',uId,(op==='+'?'+':'-')+fmt(amt)+' · '+reason,'critical');
  userNotify(uId,'Correction de crédits',fmt(amt)+' crédits '+(op==='+'?'ajoutés':'retirés')+' par l\u2019administration. Motif : '+reason,'portefeuille');
  closeModal();toast('Correction appliquée et journalisée.','ok','coins');window._page=1;render();}
 else toast('Opération impossible (solde insuffisant).','err');}

 if(!a){$('#app').innerHTML=loginHTML();refreshIcons();return;}
 if(!can(page)){toast('Accès non autorisé pour ton rôle.','err','lock');location.hash='#/dashboard';return;}
 const v=VIEWS[page]||VIEWS.dashboard;
 $('#app').innerHTML=shellHTML(v.active||page,v.render(param,param2));
 refreshIcons();window.scrollTo(0,0);if(v.mount)v.mount(param,param2);bindSearch();}

/* ---------------- STATISTIQUES ---------------- */
function daysBack(n){return [...Array(n)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(n-1-i));return d;});}
const sameDay=(iso,d)=>new Date(iso).toDateString()===d.toDateString();
function lastActive(userId){const db=Store.read();
 const ds=[...db.wallet_transactions.filter(t=>t.userId===userId).map(t=>t.date),...db.game_sessions.filter(s=>s.userId===userId).map(s=>s.date),...db.ad_views.filter(v=>v.userId===userId).map(v=>v.date)];
 return ds.length?ds.sort().reverse()[0]:null;}
function statsGlobal(){const db=Store.read();const users=db.users;
 const active=users.filter(u=>!u.suspended&&u.emailVerified&&(lastActive(u.id)?Date.now()-new Date(lastActive(u.id))<7*864e5:false)).length;
 return{total:users.length,active,inactive:users.length-active,
  newToday:users.filter(u=>isToday(u.createdAt)).length,
  pendingVerif:users.filter(u=>!u.emailVerified).length,
  creditsTotal:db.wallets.reduce((s,w)=>s+w.totalEarned,0),
  txVolume:db.wallet_transactions.filter(t=>t.status==='confirmé').reduce((s,t)=>s+(t.type==='retrait_debit'||t.type==='retrait_rembourse'?0:t.amount),0),
  txCount:db.wallet_transactions.length,
  pendWd:db.wallet_transactions.filter(t=>t.type==='retrait'&&t.status==='suspendu').length,
  pendCr:db.creator_submissions.filter(c=>c.status==='en_attente'||c.status==='en_verification').length,
  pendPay:db.payment_requests.filter(p=>p.status==='en_attente').length,
  referrals:db.referrals.reduce((s,r)=>s+(r.invited||0),0),
  adConfirmed:db.ad_views.filter(v=>v.status==='confirmé').length?db.ad_views.filter(v=>v.status==='confirmé').reduce((s,v)=>s+v.reward,0):null};}
