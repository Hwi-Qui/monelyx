<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ============================================================
   MONELYX — Design System
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#1769FF; --blue2:#287BFF; --cyan:#00B8FF; --navy:#10264B;
  --bg:#F7F9FC; --white:#fff; --gray:#667085; --line:#E9EEF5; --line2:#EDF1F7;
  --green:#0B9A57; --green-bg:#EAF9F0; --amber:#B25E00; --amber-bg:#FFF4E0;
  --red:#C13515; --red-bg:#FEEBEB; --blue-bg:#EAF1FF;
  --r:18px;
  --sh:0 1px 2px rgba(16,38,75,.05),0 12px 32px -18px rgba(16,38,75,.14);
  --sh-lg:0 2px 6px rgba(16,38,75,.06),0 24px 48px -20px rgba(23,105,255,.28);
}
html{scroll-behavior:smooth}
html.reduce-motion *,html.reduce-motion *::before,html.reduce-motion *::after{animation:none!important;transition:none!important}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--navy);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Manrope',sans-serif;line-height:1.2}
button{font-family:inherit}
::selection{background:rgba(23,105,255,.18)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#D5DEEC;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-family:'Manrope';border-radius:13px;padding:12px 18px;font-size:14px;cursor:pointer;border:1px solid transparent;transition:transform .18s,box-shadow .18s,background .18s;text-decoration:none;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn-primary{background:linear-gradient(135deg,#1769FF,#00B8FF);color:#fff;box-shadow:0 8px 20px -8px rgba(23,105,255,.55)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 26px -8px rgba(23,105,255,.6)}
.btn-primary:active{transform:scale(.98)}
.btn-outline{background:var(--surface);border-color:var(--bd);color:var(--navy)}
.btn-outline:hover{border-color:var(--blue);color:var(--blue);background:var(--tint)}
.btn-ghost{background:var(--tint2);color:var(--blue)}
.btn-ghost:hover{background:var(--tint2)}
.btn-white{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.4);backdrop-filter:blur(4px)}
.btn-white:hover{background:rgba(255,255,255,.28)}
.btn-danger{background:var(--red-bg);color:var(--red)}
.btn-danger:hover{background:#FBD9D3}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:11px}
.btn-sm svg{width:15px;height:15px}
.btn-lg{padding:15px 24px;font-size:15.5px;border-radius:15px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn.loading{pointer-events:none;opacity:.75}
.btn.loading svg{display:none}
.btn.loading::before{content:"";width:15px;height:15px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.btn-outline.loading::before,.btn-ghost.loading::before{border-color:rgba(23,105,255,.25);border-top-color:var(--blue)}
.icon-btn{position:relative;width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--navy);transition:.18s;flex:none}
.icon-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--tint)}
.icon-btn svg{width:19px;height:19px}
.icon-btn .dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}

/* ---------- Cartes ---------- */
.card{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--sh);padding:22px}
.card-hover{transition:transform .22s,box-shadow .22s}
.card-hover:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 14px}
.sec-head h2{font-size:18px;display:flex;align-items:center;gap:9px}
.sec-head h2 svg{width:19px;height:19px;color:var(--blue)}
.sec-head .link{font-size:13px;font-weight:700;color:var(--blue);display:inline-flex;gap:4px;align-items:center;cursor:pointer;background:none;border:none}
.sec-head .link svg{width:15px;height:15px}

/* ---------- Formulaires ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--text2);margin-bottom:6px}
.input,select.input,textarea.input{width:100%;padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px;font:inherit;font-size:14px;background:var(--tint);color:var(--navy);transition:.18s}
.input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(23,105,255,.12);background:var(--surface)}
.input::placeholder{color:var(--muted)}
textarea.input{resize:vertical;min-height:74px}
.f-err{display:none;color:var(--red);font-size:12px;margin-top:5px;font-weight:600}
.field.err .input{border-color:var(--red)}
.field.err .f-err{display:block}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pass-wrap{position:relative}
.pass-wrap .eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--muted);cursor:pointer;padding:4px}
.pass-wrap .eye svg{width:18px;height:18px}
.check-line{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--text2);cursor:pointer}
.check-line input{margin-top:3px;accent-color:var(--blue);width:16px;height:16px}
.check-line a{color:var(--blue);font-weight:600;cursor:pointer}

/* ---------- Badges & statuts ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;font-family:'Manrope'}
.badge svg{width:12px;height:12px}
.b-green{background:var(--green-bg);color:var(--green)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-gray{background:var(--track);color:var(--gray)}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-white{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.35)}

/* ---------- Layout / Shell ---------- */
.layout{min-height:100vh}
.sidebar{display:none}
.main{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--topbar-bg);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tb-brand{display:flex;align-items:center;gap:10px;font-family:'Manrope';font-weight:800;font-size:16px;cursor:pointer;letter-spacing:.3px}
.tb-logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#1769FF,#00B8FF);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 14px -5px rgba(23,105,255,.6)}
.tb-logo svg{width:18px;height:18px}
.tb-actions{display:flex;align-items:center;gap:10px}
.tb-avatar{border:none;background:none;cursor:pointer;padding:0;border-radius:50%}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#1769FF,#00B8FF);color:#fff;font-family:'Manrope';font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid #fff;box-shadow:0 3px 10px -3px rgba(23,105,255,.5)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:76px;height:76px;font-size:24px}
.content{width:100%;max-width:1180px;margin:0 auto;padding:20px 18px 30px;flex:1}
.footer-note{max-width:1180px;margin:0 auto;padding:8px 18px 100px;font-size:11.5px;color:var(--muted);text-align:center}
.page{animation:fadeUp .38s ease both}

/* Navigation mobile (bas) */
.bottomnav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(430px,calc(100% - 24px));background:var(--surface);border-radius:22px;box-shadow:0 10px 34px -8px rgba(16,38,75,.28),0 2px 8px rgba(16,38,75,.08);display:flex;justify-content:space-around;padding:9px 8px;z-index:50;border:1px solid var(--line2)}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:14px;transition:.2s;min-width:58px}
.bnav-item svg{width:21px;height:21px}
.bnav-item.active{color:var(--blue);background:var(--blue-bg)}

/* Desktop */
@media(min-width:1024px){
  .bottomnav{display:none}
  .sidebar{display:flex;flex-direction:column;position:fixed;top:16px;bottom:16px;left:16px;width:250px;background:var(--surface);border:1px solid var(--line2);border-radius:24px;box-shadow:var(--sh-lg);padding:20px 14px;z-index:45}
  .sb-logo{display:flex;align-items:center;gap:11px;padding:4px 10px 18px;border-bottom:1px solid var(--line2);margin-bottom:14px}
  .sb-logo .tb-logo{width:42px;height:42px;border-radius:14px}
  .sb-logo .tb-logo svg{width:22px;height:22px}
  .sb-name{font-family:'Manrope';font-weight:800;font-size:16px;letter-spacing:.3px}
  .sb-tag{font-size:10.5px;color:var(--gray);font-weight:600}
  .sb-nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto}
  .sb-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:13px;font-weight:700;font-size:14px;color:var(--text2);background:none;border:none;cursor:pointer;transition:.18s;text-align:left;width:100%}
  .sb-item svg{width:19px;height:19px}
  .sb-item:hover{background:var(--tint);color:var(--navy)}
  .sb-item.active{background:linear-gradient(135deg,#1769FF,#287BFF);color:#fff;box-shadow:0 8px 18px -7px rgba(23,105,255,.6)}
  .sb-item .badge{margin-left:auto}
  .sb-user{display:flex;align-items:center;gap:10px;padding:12px 10px 4px;border-top:1px solid var(--line2);margin-top:10px}
  .sb-user .nm{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb-user .em{font-size:11px;color:var(--gray);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .main{margin-left:282px;margin-right:16px}
  .topbar{border-radius:0 0 0 0;padding:14px 28px}
  .tb-brand{visibility:hidden;position:absolute}
  .content{padding:28px 28px 40px}
  .footer-note{padding-bottom:40px}
}

/* ---------- Carte solde ---------- */
.balance-card{position:relative;overflow:hidden;border-radius:24px;padding:26px;color:#fff;background:linear-gradient(130deg,#10264B 0%,#1769FF 58%,#00B8FF 130%);box-shadow:0 24px 48px -18px rgba(23,105,255,.5)}
.balance-card::before,.balance-card::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09);filter:blur(2px)}
.balance-card::before{width:230px;height:230px;top:-90px;right:-60px}
.balance-card::after{width:150px;height:150px;bottom:-70px;left:20%;background:rgba(0,184,255,.22)}
.bc-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.bc-label{font-size:12.5px;font-weight:700;opacity:.85;display:flex;align-items:center;gap:7px}
.bc-label svg{width:15px;height:15px}
.bc-eye{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.bc-eye:hover{background:rgba(255,255,255,.25)}
.bc-eye svg{width:17px;height:17px}
.bc-amount{font-family:'Manrope';font-size:clamp(38px,7vw,52px);font-weight:800;margin:14px 0 2px;position:relative;z-index:1;letter-spacing:-1px}
.bc-unit{font-size:14px;font-weight:600;opacity:.85;position:relative;z-index:1}
.bc-stats{display:flex;gap:0;margin-top:20px;border-top:1px solid rgba(255,255,255,.22);padding-top:16px;position:relative;z-index:1;flex-wrap:wrap}
.bc-stat{flex:1;min-width:130px}
.bc-stat+.bc-stat{border-left:1px solid rgba(255,255,255,.22);padding-left:18px}
.bc-stat .v{font-family:'Manrope';font-weight:800;font-size:19px}
.bc-stat .l{font-size:11.5px;opacity:.8;font-weight:600;margin-top:2px}
.bc-cta{margin-top:20px;position:relative;z-index:1}

/* ---------- Hero accueil ---------- */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.hero h1{font-size:clamp(21px,4vw,27px);letter-spacing:-.4px}
.hero h1 span{background:linear-gradient(90deg,#1769FF,#00B8FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--gray);font-size:13.5px;margin-top:5px;display:flex;align-items:center;gap:7px}
.hero p svg{width:15px;height:15px}
.verify-banner{display:flex;align-items:center;gap:12px;background:var(--amber-bg);border:1px solid var(--bd-amber);border-radius:15px;padding:13px 16px;margin-bottom:16px;font-size:13.5px;flex-wrap:wrap}
.verify-banner svg{width:19px;height:19px;color:var(--amber);flex:none}
.verify-banner .btn{margin-left:auto}

/* ---------- Cartes jeux ---------- */
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px}
.game-card{display:flex;flex-direction:column;overflow:hidden;padding:0}
.gc-art{height:120px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gc-art::before{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.16);top:-45px;right:-30px}
.gc-art::after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.12);bottom:-30px;left:-15px}
.gc-art svg{width:48px;height:48px;color:#fff;position:relative;z-index:1;filter:drop-shadow(0 6px 12px rgba(16,38,75,.3))}
.gc-art .gc-badge{position:absolute;top:12px;left:12px;z-index:2}
.gc-body{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.gc-body h3{font-size:15.5px;letter-spacing:.3px}
.gc-tag{font-size:11.5px;font-weight:700;color:var(--blue);margin:2px 0 7px}
.gc-body p{font-size:12.8px;color:var(--gray);flex:1;margin-bottom:14px}
.gc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* ---------- Encart pub ---------- */
.ad-card{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(120deg,#10264B,#1B3C7A 60%,#1769FF);color:#fff;padding:24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh-lg)}
.ad-card .ad-ico{width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;flex:none}
.ad-card .ad-ico svg{width:26px;height:26px}
.ad-card h3{font-size:17px;letter-spacing:.4px}
.ad-card p{font-size:13px;opacity:.85;margin-top:4px;max-width:520px}
.ad-stats{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.ad-stats span{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.24);padding:4px 10px;border-radius:999px}

/* ---------- Listes ---------- */
.list{display:flex;flex-direction:column}
.list-row{display:flex;align-items:center;gap:13px;padding:13px 4px;border-bottom:1px solid var(--line2)}
.list-row:last-child{border-bottom:none}
.lr-ico{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.lr-ico svg{width:19px;height:19px}
.lr-main{flex:1;min-width:0}
.lr-main .t{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr-main .s{font-size:11.8px;color:var(--gray);margin-top:1px}
.lr-right{text-align:right;flex:none}
.lr-right .amt{font-family:'Manrope';font-weight:800;font-size:14px}
.lr-right .amt.pos{color:var(--green)}
.lr-right .amt.neg{color:var(--amber)}
.lr-right .st{margin-top:3px}
.t-dot{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;font-size:13px;flex:none}

/* ---------- Grilles ---------- */
.grid-2{display:grid;grid-template-columns:1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr;gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:760px){.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:repeat(3,1fr)}.grid-4{grid-template-columns:repeat(4,1fr)}}
.stat-tile{background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:16px 18px;box-shadow:var(--sh)}
.stat-tile .l{font-size:11.5px;font-weight:700;color:var(--gray);display:flex;align-items:center;gap:6px}
.stat-tile .l svg{width:14px;height:14px}
.stat-tile .v{font-family:'Manrope';font-weight:800;font-size:22px;margin-top:6px;letter-spacing:-.3px}
.stat-tile .h{font-size:11px;color:var(--muted);margin-top:2px}

/* ---------- Défis / progression ---------- */
.ch-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.ch-row:last-child{border:none}
.ch-ico{width:40px;height:40px;border-radius:12px;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.ch-ico svg{width:18px;height:18px}
.ch-ico.done{background:var(--green-bg);color:var(--green)}
.ch-main{flex:1}.ch-main .t{font-weight:700;font-size:13.5px}.ch-main .s{font-size:11.8px;color:var(--gray)}
.progress{height:8px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:7px}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#1769FF,#00B8FF);transition:width .6s ease}
.lvl-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;background:linear-gradient(135deg,#10264B,#1769FF);color:#fff;font-family:'Manrope';font-weight:800;font-size:13px;box-shadow:0 8px 18px -7px rgba(23,105,255,.55)}
.lvl-chip svg{width:15px;height:15px}

/* ---------- Carte bancaire virtuelle ---------- */
.vcard{position:relative;overflow:hidden;border-radius:22px;aspect-ratio:1.65;max-width:460px;padding:22px;color:#fff;background:linear-gradient(125deg,#10264B 0%,#1769FF 55%,#00B8FF 125%);box-shadow:0 22px 44px -16px rgba(23,105,255,.55);display:flex;flex-direction:column;justify-content:space-between}
.vcard::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08);top:-110px;right:-70px}
.vcard::after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;border:1.5px solid rgba(255,255,255,.18);bottom:-70px;left:-40px}
.vc-top{display:flex;justify-content:space-between;align-items:flex-start;z-index:1}
.vc-brand{display:flex;align-items:center;gap:9px;font-family:'Manrope';font-weight:800;font-size:14.5px;letter-spacing:.5px}
.vc-chip{width:40px;height:29px;border-radius:7px;background:linear-gradient(135deg,#FFD98A,#F0B34C);opacity:.95;position:relative}
.vc-chip::after{content:"";position:absolute;inset:6px 5px;border:1px solid rgba(120,80,10,.4);border-radius:4px}
.vc-bal{z-index:1}
.vc-bal .v{font-family:'Manrope';font-weight:800;font-size:clamp(26px,5vw,34px);letter-spacing:-.5px}
.vc-bal .e{font-size:12px;opacity:.85;font-weight:600;margin-top:2px}
.vc-bottom{display:flex;justify-content:space-between;align-items:flex-end;z-index:1;font-size:11.5px;gap:10px;flex-wrap:wrap}
.vc-bottom .lab{opacity:.7;font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.vc-bottom .val{font-weight:700;margin-top:2px;font-family:'Manrope'}

/* ---------- Jeux ---------- */
.game-shell{max-width:720px;margin:0 auto}
.game-hud{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.hud-pill{background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:8px 14px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;box-shadow:var(--sh)}
.hud-pill svg{width:15px;height:15px;color:var(--blue)}
.game-stage{background:var(--surface);border:1px solid var(--line2);border-radius:20px;box-shadow:var(--sh);overflow:hidden;position:relative;min-height:340px}
.game-overlay{position:absolute;inset:0;background:var(--overlay);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:10;padding:22px}
.go-card{text-align:center;max-width:430px;width:100%}
.go-ico{width:70px;height:70px;border-radius:22px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 14px 28px -10px rgba(23,105,255,.6)}
.go-ico svg{width:32px;height:32px}
.go-card h3{font-size:21px;margin-bottom:8px}
.go-card p{color:var(--gray);font-size:13.5px;margin-bottom:16px}
.rules-box{text-align:left;background:var(--tint);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:18px;font-size:13px}
.rules-box li{margin-left:18px;margin-bottom:5px;color:var(--text2)}
.score-big{font-family:'Manrope';font-weight:800;font-size:44px;letter-spacing:-1px;background:linear-gradient(90deg,#1769FF,#00B8FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.runner-wrap canvas{display:block;width:100%;touch-action:none}
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px;max-width:440px;margin:0 auto}
.mem-card{aspect-ratio:1;perspective:600px;background:none;border:none;cursor:pointer;padding:0}
.mem-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .4s}
.mem-card.flip .mem-inner{transform:rotateY(180deg)}
.mem-face{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden}
.mem-back{background:linear-gradient(135deg,#1769FF,#287BFF);color:rgba(255,255,255,.85);box-shadow:0 6px 14px -6px rgba(23,105,255,.5)}
.mem-back svg{width:22px;height:22px}
.mem-front{background:var(--surface);border:1.5px solid var(--line);transform:rotateY(180deg);color:var(--blue)}
.mem-front svg{width:26px;height:26px}
.mem-card.done .mem-front{background:var(--green-bg);border-color:var(--bd-green);color:var(--green)}
.pz-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:18px;max-width:380px;margin:0 auto}
.pz-tile{aspect-ratio:1;border-radius:14px;border:none;font-family:'Manrope';font-weight:800;font-size:24px;color:#fff;background:linear-gradient(135deg,#1769FF,#287BFF);cursor:pointer;box-shadow:0 5px 12px -5px rgba(23,105,255,.5);transition:transform .12s}
.pz-tile:active{transform:scale(.95)}
.pz-empty{background:var(--track);border-radius:14px}
.ch-arena{position:relative;height:340px;background:linear-gradient(180deg,var(--tint),var(--tint2));overflow:hidden}
.ch-target{position:absolute;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#6FB6FF,#1769FF 65%);border:3px solid #fff;box-shadow:0 8px 18px -6px rgba(23,105,255,.6);cursor:pointer;animation:pop .25s ease both;display:flex;align-items:center;justify-content:center;color:#fff}
.ch-target svg{width:20px;height:20px}
.ch-target.bonus{background:radial-gradient(circle at 32% 30%,#FFE9A8,#F79009 70%)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- Auth ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:26px 18px;position:relative;overflow:hidden}
.auth-wrap::before{content:"";position:fixed;top:-180px;right:-180px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(23,105,255,.16),transparent 65%)}
.auth-wrap::after{content:"";position:fixed;bottom:-200px;left:-160px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(0,184,255,.13),transparent 65%)}
.auth-card{width:100%;max-width:480px;position:relative;z-index:1;animation:fadeUp .4s ease both}
.auth-brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px}
.auth-brand .tb-logo{width:50px;height:50px;border-radius:16px}
.auth-brand .tb-logo svg{width:26px;height:26px}
.auth-brand h1{font-size:22px;letter-spacing:.5px}
.welcome-hero{text-align:center;margin-bottom:24px}
.welcome-hero h2{font-size:clamp(25px,5vw,32px);letter-spacing:-.5px;margin-bottom:10px}
.welcome-hero h2 span{background:linear-gradient(90deg,#1769FF,#00B8FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome-hero p{color:var(--gray);max-width:400px;margin:0 auto;font-size:14px}
.feature-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0}
.feature-item{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:12px;font-size:12.5px;font-weight:700;box-shadow:var(--sh)}
.feature-item svg{width:18px;height:18px;color:var(--blue);flex:none}
.captcha-box{display:flex;align-items:center;gap:12px}
.captcha-code{font-family:'Manrope';font-weight:800;font-size:20px;letter-spacing:7px;background:linear-gradient(90deg,#1769FF,#00B8FF);-webkit-background-clip:text;background-clip:text;color:transparent;transform:rotate(-2deg);user-select:none;font-style:italic}

/* ---------- Modales / toasts ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(16,38,75,.48);backdrop-filter:blur(5px);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;animation:fadeIn .2s ease}
.modal{background:var(--surface);border-radius:22px;width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 30px 70px -20px rgba(16,38,75,.5);animation:popIn .28s cubic-bezier(.2,.9,.3,1.2) both}
.modal-wide{max-width:620px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 0}
.modal-head h3{font-size:17px}
.modal-body{padding:16px 22px;overflow-y:auto}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;padding:0 22px 20px;flex-wrap:wrap}
#toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:9px;width:min(400px,calc(100% - 28px))}
.toast{display:flex;align-items:center;gap:11px;background:var(--surface);border-radius:14px;padding:13px 16px;box-shadow:0 14px 34px -10px rgba(16,38,75,.3);border:1px solid var(--line2);font-size:13.5px;font-weight:600;animation:slideDown .3s ease both}
.toast svg{width:19px;height:19px;flex:none}
.t-ok svg{color:var(--green)}.t-err svg{color:var(--red)}.t-info svg{color:var(--blue)}.t-warn svg{color:var(--amber)}
.toast.out{opacity:0;transform:translateY(-8px);transition:.3s}

/* ---------- Divers ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--text2);cursor:pointer;transition:.18s}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.active{background:linear-gradient(135deg,#1769FF,#287BFF);color:#fff;border-color:transparent;box-shadow:0 6px 14px -6px rgba(23,105,255,.55)}
.empty{text-align:center;padding:36px 18px;color:var(--gray)}
.empty svg{width:38px;height:38px;color:var(--muted);margin-bottom:10px}
.empty h4{color:var(--navy);font-size:15px;margin-bottom:4px}
.empty p{font-size:13px;max-width:340px;margin:0 auto}
.info-strip{display:flex;gap:10px;align-items:flex-start;background:var(--tint);border:1px solid var(--bd);border-radius:14px;padding:13px 15px;font-size:12.8px;color:var(--text2)}
.info-strip svg{width:17px;height:17px;color:var(--blue);flex:none;margin-top:1px}
.demo-tag{font-size:10.5px;font-weight:800;letter-spacing:.4px;color:var(--amber);background:var(--amber-bg);padding:3px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:5px}
.divider{height:1px;background:var(--line2);margin:16px 0}
.switch{position:relative;width:44px;height:25px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--track);border-radius:99px;transition:.2s;cursor:pointer}
.switch i::after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:var(--surface);top:3px;left:3px;transition:.2s;box-shadow:0 2px 5px rgba(16,38,75,.25)}
.switch input:checked+i{background:linear-gradient(90deg,#1769FF,#00B8FF)}
.switch input:checked+i::after{left:22px}
.pref-row{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line2)}
.pref-row:last-child{border:none}
.pref-row .t{font-weight:700;font-size:13.5px}
.pref-row .s{font-size:12px;color:var(--gray)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line2);font-size:13.5px}
.kv:last-child{border:none}
.kv .k{color:var(--gray);font-weight:600}
.kv .v{font-weight:700;text-align:right;word-break:break-word}
details.faq{border:1px solid var(--line2);border-radius:14px;margin-bottom:10px;background:var(--surface);overflow:hidden}
details.faq summary{padding:14px 16px;font-weight:700;font-size:13.5px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;list-style:none}
details.faq summary::after{content:"+";font-size:19px;color:var(--blue);font-weight:800}
details.faq[open] summary::after{content:"–"}
details.faq .a{padding:0 16px 14px;font-size:13px;color:var(--text2)}
.news-item{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--line2)}
.news-item:last-child{border:none}
.news-item .d{font-size:11px;color:var(--gray);font-weight:700;margin-top:2px}
.timeline{display:flex;flex-direction:column;gap:0}
.tl-step{display:flex;gap:13px;position:relative;padding-bottom:20px}
.tl-step:last-child{padding-bottom:0}
.tl-step::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.tl-step:last-child::before{display:none}
.tl-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--track);color:var(--muted);z-index:1}
.tl-dot svg{width:14px;height:14px}
.tl-step.on .tl-dot{background:linear-gradient(135deg,#1769FF,#00B8FF);color:#fff}
.tl-step .t{font-weight:700;font-size:13.5px}.tl-step .s{font-size:12px;color:var(--gray)}
.scroll-x{display:flex;gap:13px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.scroll-x>*{scroll-snap-align:start;flex:0 0 240px}
.method-card{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;transition:.18s;background:var(--surface)}
.method-card:hover{border-color:var(--bd)}
.method-card.sel{border-color:var(--blue);background:var(--tint);box-shadow:0 0 0 3px rgba(23,105,255,.12)}
.method-card svg{width:22px;height:22px;color:var(--blue)}
.method-card .t{font-weight:700;font-size:13.5px}
.method-card .s{font-size:11.5px;color:var(--gray)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.floaty{animation:floaty 4s ease-in-out infinite}

/* ============================================================
   MONELYX — COUCHE RESPONSIVE MOBILE (v2)
   Objectifs : zéro défilement horizontal, alignements propres,
   cibles tactiles confortables, zones sûres (encoche / barre iOS).
   ============================================================ */

/* ---------- Socle ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
body{-webkit-tap-highlight-color:transparent}
img,svg,video,canvas{max-width:100%}
h1,h2,h3,h4{overflow-wrap:break-word}
.layout,.main,.auth-wrap{min-height:100vh}
@supports(height:100dvh){.layout,.main,.auth-wrap{min-height:100dvh}}
.main,.content,.card,.stat-tile,.list-row,.auth-card,.game-shell{min-width:0}
.btn{max-width:100%}

/* ---------- Grilles : 1fr -> minmax(0,1fr) (évite le « grid blowout ») ---------- */
.grid-2,.grid-3{grid-template-columns:minmax(0,1fr)}
.grid-4,.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:760px){
  .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
}
.grid-3.cols-2,.grid-4.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-2>*,.grid-3>*,.grid-4>*,.rf-top>*,.rf-viz>*,.rf-stats>*,.f-row>*,.feature-row>*{min-width:0}
.rf-top{grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.rf-top{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}}
.rf-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:760px){.rf-stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rf-viz{grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.rf-viz{grid-template-columns:repeat(2,minmax(0,1fr))}}
.feature-row{grid-template-columns:repeat(2,minmax(0,1fr))}
.games-grid{grid-template-columns:repeat(auto-fill,minmax(min(255px,100%),1fr))}

/* ---------- En-têtes de section : jamais de débordement ---------- */
.sec-head{flex-wrap:wrap;row-gap:8px}
.sec-head h2{min-width:0}
.sec-head .link{padding:8px 2px;margin:-8px -2px}

/* ---------- Barre du haut + zones sûres (encoche) ---------- */
@media(max-width:1023px){
  .topbar{padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
  .content{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
  .footer-note{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
}
#toasts{top:calc(16px + env(safe-area-inset-top,0px))}

/* ---------- Navigation du bas : 5 onglets qui tiennent à 320 px ---------- */
.bottomnav{bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100% - 20px));gap:2px;padding:9px 6px}
.bnav-item{flex:1 1 0;min-width:0;padding:6px 2px;white-space:nowrap}
.bnav-item.center,.bnav-item.center.active{flex:1.5 1 0;min-width:0;padding:9px 4px 8px}
@media(max-width:380px){
  .bnav-item{font-size:10px}
  .bnav-item svg{width:20px;height:20px}
  .bnav-item.center svg{width:22px;height:22px}
}
@media(min-width:1024px){.bottomnav{display:none}}

/* ---------- Boutons ---------- */
@media(max-width:420px){
  .btn{white-space:normal;line-height:1.25;text-align:center}
  .btn-lg{padding:14px 18px}
}
@media(hover:none){
  .card-hover:hover{transform:none;box-shadow:var(--sh)}
  .btn-primary:hover{transform:none}
  .game-card:hover .gc-img{transform:none}
}

/* ---------- Cartes & espacements sur petits écrans ---------- */
@media(max-width:380px){
  .content{padding-top:16px}
  .card{padding:18px 16px}
  .stat-tile{padding:14px}
  .stat-tile .v{font-size:20px}
  .modal-head h3{font-size:16px}
}
.stat-tile .v,.stat-tile .l{overflow-wrap:anywhere}

/* ---------- Accueil : bandeau de vérification ---------- */
.verify-banner{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:10px 12px}
.verify-banner svg{margin-top:1px}
.verify-banner .btn{grid-column:1/-1;margin-left:0;width:100%}
@media(min-width:620px){
  .verify-banner{display:flex;align-items:center}
  .verify-banner .btn{margin-left:auto;width:auto}
}
.hero>div{min-width:0}

/* ---------- Carte solde : 3 statistiques alignées ---------- */
.bc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.bc-stat{min-width:0}
.bc-stat+.bc-stat{padding-left:14px}
.bc-stat .v{overflow-wrap:anywhere}
.bc-amount{overflow-wrap:anywhere}
@media(max-width:420px){
  .balance-card{padding:20px 18px}
  .bc-stat .v{font-size:17px}
  .bc-stat .l{font-size:11px}
  .bc-stat+.bc-stat{padding-left:10px}
  .bc-cta .btn{width:100%}
}

/* ---------- Carte virtuelle (portefeuille) ---------- */
.vcard{width:100%}
.vc-bottom .val{overflow-wrap:anywhere}
@media(max-width:560px){
  .vcard{aspect-ratio:auto;min-height:208px;gap:18px;padding:18px}
  .vc-top{gap:10px}
  .vc-brand{flex-wrap:wrap;gap:8px;min-width:0}
  .vc-bal .v{font-size:clamp(26px,9vw,32px)}
  .vc-bottom{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;align-items:start}
  .vc-bottom>div:first-child{grid-column:1/-1}
}

/* ---------- Listes ---------- */
.lr-main .s{overflow-wrap:anywhere}
.lr-right{max-width:46%}
.lr-right .badge{white-space:normal;text-align:center;line-height:1.25}
.list-row{min-height:52px}
.card table{width:100%}
.card table td:first-child{white-space:nowrap}

/* ---------- Puces / filtres ---------- */
.chip{min-height:38px}

/* ---------- Carrousels (Jeux) ---------- */
.scroll-x>*{flex:0 0 min(260px,82%)}
@media(max-width:1023px){
  .scroll-x{scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-padding-left:2px}
  .scroll-x::-webkit-scrollbar{display:none}
}
.gc-foot{flex-wrap:wrap}

/* ---------- Formulaires ---------- */
.f-row{column-gap:12px;row-gap:0}
.f-row>.field{display:flex;flex-direction:column}
.f-row>.field>label{flex:1 0 auto;display:flex;align-items:flex-end}
.field label.check-line{display:flex;gap:10px;align-items:flex-start;margin-bottom:0;font-size:13px;font-weight:500;color:var(--text2);line-height:1.45}
.field label.check-line input{flex:none}
.pass-wrap .input{padding-right:44px}
.pass-wrap .eye{padding:8px;right:4px}
input.input[type="date"],input.input[type="time"]{display:block;width:100%;min-width:0;min-height:46px;-webkit-appearance:none;appearance:none;text-align:left}
.captcha-box{flex-wrap:wrap}
.captcha-box .input{min-width:120px}
@media(max-width:760px){
  /* 16 px : empêche le zoom automatique d'iOS au focus d'un champ */
  .input,select.input,textarea.input,.rf-linkbox input,.rf-search .input{font-size:16px}
}
@media(max-width:440px){
  .f-row{grid-template-columns:minmax(0,1fr)}
  .f-row>.field>label{display:block;flex:none}
  .captcha-box .input{flex:1 1 100%!important}
}

/* ---------- Authentification ---------- */
.auth-wrap{padding:26px max(18px,env(safe-area-inset-right)) calc(26px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left))}
@media(max-height:640px){.auth-wrap{align-items:flex-start}}
@media(max-width:340px){.feature-row{grid-template-columns:minmax(0,1fr)}}

/* ---------- Profil / Paramètres ---------- */
.pf-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 16px;align-items:center}
.pf-head .pf-edit{grid-column:1/-1;width:100%}
.pf-txt{min-width:0}
.pf-txt h3{font-size:19px;overflow-wrap:anywhere}
.pf-meta{display:flex;gap:6px;align-items:flex-start;color:var(--gray);font-size:13px;line-height:1.4;margin-top:4px}
.pf-meta svg{width:15px;height:15px;flex:none;margin-top:2px}
@media(min-width:640px){
  .pf-head{grid-template-columns:auto minmax(0,1fr) auto}
  .pf-head .pf-edit{grid-column:auto;width:auto}
}
.pref-row>div:first-child{min-width:0}
.pref-row select.input{width:auto!important;flex:none;max-width:50%}
.kv .v{min-width:0}

/* ---------- Page jeu ---------- */
.gh-card{display:flex;gap:16px;align-items:center;padding:16px}
.gh-txt{flex:1;min-width:0}
.gh-txt h2{font-size:18px;overflow-wrap:anywhere}
.gh-txt .gh-sub{font-size:12.5px;color:var(--gray)}
.gh-badges{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
@media(max-width:400px){
  .gh-card{gap:12px;padding:14px}
  .g-thumb{width:72px}
  .gh-txt h2{font-size:16.5px}
}
.hud-pill{flex:1 1 104px;justify-content:center;min-width:0;padding:8px 10px}
.game-hud{justify-content:stretch}
.game-stage{min-height:300px}
.mem-inner{display:block}               /* correctif : le <span> inline avait une taille nulle -> plateau Memory vide */
.mem-grid{gap:8px;padding:14px}
@media(min-width:521px){.mem-grid{gap:10px;padding:16px}}
.go-card{min-width:0}
.go-card .btn{max-width:100%}
.go-card h3{overflow-wrap:anywhere}

/* ---------- Parrainage ---------- */
.rf-code>div{min-width:0}
.rf-code .val{overflow-wrap:anywhere}
.rf-actions .btn{flex:1 1 auto}
.rf-legend{min-width:min(130px,100%)}
@media(max-width:520px){
  .rf-ringwrap{justify-content:center}
  .rf-invite,.rf-qr{padding:20px 18px}
}

/* ---------- Modales ---------- */
.modal-overlay{padding:14px max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.modal{max-height:calc(100vh - 28px)}
@supports(height:100dvh){.modal{max-height:calc(100dvh - 28px)}}
.modal-head h3{min-width:0;overflow-wrap:anywhere}
.modal-body{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media(max-width:480px){
  .modal{border-radius:20px}
  .modal-head{padding:16px 18px 0}
  .modal-body{padding:14px 18px}
  .modal-actions{padding:0 18px 18px;flex-direction:column-reverse;gap:8px}
  .modal-actions .btn{width:100%}
}

/* ============================================================
   RETRAIT · DÉBLOCAGE · ADMINISTRATION
   ============================================================ */
.wd-hero{position:relative;overflow:hidden;border-radius:24px;padding:24px;color:#fff;background:linear-gradient(130deg,#10264B 0%,#1769FF 60%,#00B8FF 135%);box-shadow:0 24px 48px -20px rgba(23,105,255,.55)}
.wd-hero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08);top:-110px;right:-70px}
.wd-hero::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(0,184,255,.2);bottom:-90px;left:30%}
.wd-hero>*{position:relative;z-index:1}
.wd-hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.wd-lab{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;opacity:.88}
.wd-lab svg{width:15px;height:15px}
.wd-bal{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(34px,8vw,50px);letter-spacing:-1px;margin-top:8px;display:flex;align-items:baseline;gap:8px;line-height:1.05;overflow-wrap:anywhere}
.wd-bal small{font-size:15px;font-weight:700;opacity:.85;letter-spacing:0}
.wd-sub{font-size:12px;opacity:.8;margin-top:4px}
.wd-state{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34)}
.wd-state svg{width:15px;height:15px}
.wd-state.ok{background:rgba(18,184,134,.28);border-color:rgba(130,255,200,.55)}
.wd-mini{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:20px}
@media(min-width:640px){.wd-mini{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wd-mt{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);border-radius:16px;padding:13px 14px;min-width:0}
.wd-mt .k{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;opacity:.85}
.wd-mt .k svg{width:14px;height:14px}
.wd-mt .v{font-family:'Manrope',sans-serif;font-weight:800;font-size:17px;margin-top:5px;overflow-wrap:anywhere}
.wd-mt .h{font-size:11.5px;opacity:.82;margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wd-edit{display:inline-flex;align-items:center;gap:4px;border:none;background:rgba(255,255,255,.22);color:#fff;font:inherit;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;cursor:pointer;transition:.18s}
.wd-edit:hover{background:rgba(255,255,255,.36)}
.wd-edit svg{width:12px;height:12px}
.wd-flow{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.wd-flow:empty{display:none}
.wd-off{background:var(--amber-bg);border-color:var(--bd-amber);color:var(--amber-ink)}
.wd-off svg{color:var(--amber)}

/* --- DÉBLOQUEZ VOTRE COMPTE --- */
.wd-unlock{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;border-radius:26px;padding:26px;color:#fff;
  background:linear-gradient(135deg,#0B1B3A 0%,#10264B 35%,#1769FF 100%);box-shadow:0 28px 56px -24px rgba(16,38,75,.75)}
.wd-unlock::before{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(0,184,255,.38),transparent 68%);top:-120px;right:-80px}
.wd-unlock>*{position:relative;z-index:1;min-width:0}
@media(min-width:900px){.wd-unlock{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);padding:32px;gap:30px}}
.wd-un-ico{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);box-shadow:0 0 0 8px rgba(255,255,255,.05)}
.wd-un-ico svg{width:28px;height:28px}
.wd-un-kick{margin-top:16px;font-size:12px;font-weight:700;color:#8FDBFF;letter-spacing:.2px}
.wd-unlock h2{font-size:clamp(24px,5.6vw,34px);letter-spacing:.4px;margin:6px 0 10px;line-height:1.1}
.wd-un-price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wd-un-price span{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(40px,10vw,58px);line-height:1;letter-spacing:-1.5px;background:linear-gradient(180deg,#fff,#9FE3FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.wd-un-price small{font-size:17px;font-weight:800;color:#CFEFFF}
.wd-un-price em{font-style:normal;font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);margin-left:4px}
.wd-unlock p{font-size:13.5px;opacity:.9;margin-top:12px;max-width:470px}
.wd-un-note{display:flex;gap:9px;align-items:flex-start;margin-top:14px;padding:11px 13px;border-radius:14px;font-size:12.5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.26)}
.wd-un-note svg{width:16px;height:16px;flex:none;margin-top:1px}
.wd-un-note.bad{background:rgba(255,90,70,.22);border-color:rgba(255,160,140,.5)}
.wd-un-cta{margin-top:18px}
.wd-un-cta .btn{color:var(--blue)}
.wd-un-steps{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:18px;align-self:start}
.wd-un-steps h4{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:14px}
.wd-un-steps h4 svg{width:17px;height:17px;color:#8FDBFF}
.wd-un-steps ol{list-style:none;display:flex;flex-direction:column;gap:14px;position:relative}
.wd-un-steps li{display:flex;gap:12px;align-items:flex-start;opacity:.62;position:relative}
.wd-un-steps li:not(:last-child)::after{content:"";position:absolute;left:15px;top:34px;bottom:-14px;width:2px;background:rgba(255,255,255,.22)}
.wd-un-steps li.now,.wd-un-steps li.done{opacity:1}
.wd-un-steps .n{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:800;font-size:14px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.4)}
.wd-un-steps li.now .n{background:var(--surface);color:var(--blue);border-color:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.16)}
.wd-un-steps li.done .n{background:#12B886;border-color:#12B886}
.wd-un-steps .n svg{width:16px;height:16px}
.wd-un-steps b{display:block;font-size:14px}
.wd-un-steps small{display:block;font-size:12px;opacity:.82;margin-top:2px}

/* --- VOS OBJECTIFS À ATTEINDRE --- */
.ob-list{padding:6px 20px}
.ob{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line2)}
.ob:last-child{border-bottom:none}
.ob-ico{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--track);color:var(--muted);margin-top:2px}
.ob-ico svg{width:18px;height:18px}
.ob-now .ob-ico{background:var(--amber-bg);color:var(--amber)}
.ob-done .ob-ico{background:#12B886;color:#fff;box-shadow:0 0 0 5px rgba(18,184,134,.16)}
.ob-main{flex:1;min-width:0}
.ob-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.ob-t{font-weight:800;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.ob-d{font-size:13px;color:var(--gray);margin-top:3px}
.ob .progress{height:9px;margin-top:11px}
.ob-done .progress i{background:linear-gradient(90deg,#12B886,#2BD9A5)}
.ob-n{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--gray);font-weight:600;margin-top:6px}
.ob-n b{font-family:'Manrope',sans-serif;color:var(--navy)}

/* --- FÉLICITATIONS --- */
.wd-ok{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-radius:26px;padding:26px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(130deg,#0A8F6A 0%,#12B886 52%,#00B8FF 130%);box-shadow:0 26px 50px -22px rgba(18,184,134,.7);animation:popIn .5s cubic-bezier(.2,.9,.3,1.2) both}
.wd-ok::before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.12);top:-100px;right:-60px}
.wd-ok>*{position:relative;z-index:1}
.wd-ok-ico{width:64px;height:64px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--surface);color:#12B886;box-shadow:0 0 0 8px rgba(255,255,255,.22);animation:wdPulse 2.4s ease-out 1}
.wd-ok-ico svg{width:32px;height:32px;stroke-width:3}
@keyframes wdPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%{box-shadow:0 0 0 20px rgba(255,255,255,0)}100%{box-shadow:0 0 0 8px rgba(255,255,255,.22)}}
.wd-ok-txt{flex:1 1 260px;min-width:0}
.wd-ok h3{font-size:clamp(19px,4.6vw,26px);letter-spacing:.3px}
.wd-ok p{font-size:13.5px;opacity:.95;margin-top:6px}
.wd-ok .btn{color:#0A8F6A;flex:none}
.wd-ok-mini{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:16px;background:var(--green-bg);color:var(--green-ink);font-size:13.5px;border:1px solid var(--bd-green)}
.wd-ok-mini svg{width:19px;height:19px;flex:none}

/* --- Formulaire de retrait --- */
.wd-form-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.wd-form-head h4{display:flex;align-items:center;gap:8px;font-size:15.5px}
.wd-form-head h4 svg{width:18px;height:18px;color:var(--blue)}
.wd-lockmsg{margin-bottom:14px;background:var(--amber-bg);border-color:var(--bd-amber);color:var(--amber-ink)}
.wd-lockmsg svg{color:var(--amber)}
.amt-wrap{position:relative}
.amt-wrap .input{padding-right:70px;font-family:'Manrope',sans-serif;font-weight:800;font-size:18px}
.amt-wrap .suf{position:absolute;right:15px;top:50%;transform:translateY(-50%);font-size:12.5px;font-weight:800;color:var(--gray);pointer-events:none}
.wd-hint{font-size:12.5px;color:var(--gray);margin-top:7px;min-height:18px}
.wd-hint.ok{color:var(--green);font-weight:600}
.wd-hint.bad{color:var(--red);font-weight:600}
.wd-quick{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 16px}
.wd-quick button{border:1.5px solid var(--line);background:var(--surface);color:var(--blue);font:inherit;font-size:12.5px;font-weight:800;padding:8px 13px;border-radius:999px;cursor:pointer;transition:.18s}
.wd-quick button:hover{border-color:var(--blue);background:var(--blue-bg)}
.wd-recap{background:var(--tint);border:1px solid var(--bd);border-radius:14px;padding:4px 14px;margin-bottom:16px}
.wd-form.locked .amt-wrap .input{background:var(--track);color:var(--muted)}
.wd-form.locked .wd-recap{opacity:.7}
.wd-form .btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}

/* --- Historique --- */
.wd-row{display:flex;align-items:flex-start;gap:13px;padding:14px 2px;border-bottom:1px solid var(--line2)}
.wd-row:last-child{border-bottom:none}
.wd-row .lr-ico{margin-top:2px}
.wd-row .lr-main{flex:1;min-width:0}
.wd-row .lr-main .t{font-weight:800;font-size:14px;overflow-wrap:anywhere}
.wd-row .lr-main .s{font-size:12px;color:var(--gray);margin-top:3px;line-height:1.5;overflow-wrap:anywhere}
.wd-row .lr-right{flex:none}
.wd-reason{display:flex;align-items:flex-start;gap:6px;margin-top:6px;font-size:12px;color:var(--red-ink);background:var(--red-bg);padding:6px 10px;border-radius:10px}
.wd-reason svg{width:14px;height:14px;flex:none;margin-top:1px}

/* --- Page paiement de déblocage --- */
.unl-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media(min-width:900px){.unl-grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}.unl-sum{position:sticky;top:90px}}
.unl-step{display:flex;gap:12px;align-items:flex-start;margin:16px 0 10px}
.unl-step>span{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--blue);color:#fff;font-family:'Manrope',sans-serif;font-weight:800;font-size:13px}
.unl-step b{font-size:14px;display:block}
.unl-step small{display:block;font-size:12.5px;color:var(--gray);margin-top:2px}
.unl-merchant{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:16px;background:linear-gradient(120deg,var(--tint),var(--tint2));border:1.5px dashed var(--bd);margin-bottom:6px}
.unl-merchant small{display:block;font-size:11.5px;color:var(--gray);font-weight:700}
.unl-merchant b{font-family:'Manrope',sans-serif;font-size:clamp(18px,5vw,22px);letter-spacing:1px;color:var(--navy);overflow-wrap:anywhere}
.unl-merchant b.none{font-size:14px;letter-spacing:0;color:var(--amber)}
.unl-copy{background:var(--blue);border-color:var(--blue)}
.unl-copy:hover{background:#1257D6}
.unl-amt{display:flex;align-items:baseline;gap:7px;margin:12px 0 10px;font-family:'Manrope',sans-serif}
.unl-amt span{font-weight:800;font-size:38px;letter-spacing:-1px;color:var(--blue)}
.unl-amt small{font-weight:800;font-size:15px;color:var(--gray)}
.unl-state{text-align:center;padding:34px 22px;display:flex;flex-direction:column;align-items:center;gap:10px}
.unl-state>svg{width:54px;height:54px}
.unl-state.ok>svg{color:#12B886}
.unl-state.wait>svg{color:var(--amber)}
.unl-state p{color:var(--gray);font-size:13.5px;max-width:420px}
.unl-recap{width:100%;max-width:420px;text-align:left;background:var(--tint);border:1px solid var(--bd);border-radius:14px;padding:4px 14px;margin:6px 0 8px}

/* --- Administration --- */
.adm-stats .stat-tile .v{font-size:24px}
.adm-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.adm-bar p{font-size:13px;color:var(--gray);flex:1 1 260px}
.adm-card{margin-bottom:14px}
.adm-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.adm-who{display:flex;align-items:center;gap:11px;min-width:0;flex:1 1 220px}
.adm-who div{min-width:0}
.adm-who b{display:block;font-size:14.5px;overflow-wrap:anywhere}
.adm-who span{display:block;font-size:12px;color:var(--gray);overflow-wrap:anywhere}
.adm-amt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-family:'Manrope',sans-serif;font-weight:800;font-size:19px}
.adm-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:12px;font-size:12.5px;color:var(--gray)}
.adm-meta svg{width:14px;height:14px;margin-right:-4px}
.adm-meta i{width:3px;height:3px;border-radius:50%;background:#C3CEDD}
.adm-checks{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.adm-chk{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px}
.adm-chk svg{width:13px;height:13px}
.adm-chk.ok{background:var(--green-bg);color:var(--green)}
.adm-chk.ko{background:var(--red-bg);color:var(--red)}
.adm-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:12px;font-size:12.5px;color:var(--gray)}
.adm-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
.adm-actions:empty{display:none}
.adm-danger{color:var(--red);border-color:var(--bd-red)}
.adm-danger:hover{background:var(--red-bg);border-color:var(--red)}
.adm-danger-solid{background:var(--red);box-shadow:none}
.adm-obj{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line2)}
.adm-obj:last-child{border-bottom:none}
.adm-obj.off{opacity:.55}
.ob-ico-sm{width:30px;height:30px;font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;color:var(--blue);background:var(--blue-bg)}
.adm-icons{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;flex:none;max-width:132px}
.adm-icons .icon-btn{width:34px;height:34px}
.adm-icons .icon-btn:disabled{opacity:.35;cursor:default}
select.input{appearance:auto}
textarea.input{resize:vertical;min-height:70px;font-family:inherit}
@media(prefers-reduced-motion:reduce){.wd-ok,.wd-ok-ico{animation:none!important}}
@media(max-width:480px){
  .wd-hero,.wd-unlock,.wd-ok{padding:20px 18px;border-radius:22px}
  .ob-list{padding:4px 16px}
  .adm-amt{align-items:flex-start;flex-direction:row;align-items:center;flex-wrap:wrap;width:100%;justify-content:space-between}
  .adm-icons{max-width:none}
  .adm-obj{flex-wrap:wrap}
  .adm-obj .lr-main{flex:1 1 calc(100% - 50px)}
  .adm-icons{width:100%;justify-content:flex-start}
}

.wd-un-cta .btn,.wd-ok .btn{background:var(--surface);border:1px solid #fff;box-shadow:0 14px 26px -12px rgba(0,0,0,.45)}
.wd-un-cta .btn{color:var(--blue)}
.wd-un-cta .btn:hover,.wd-ok .btn:hover{background:var(--tint)}
.wd-un-cta .btn svg,.wd-ok .btn svg{color:inherit}
.wd-row .lr-main .t{white-space:normal}
@media(max-width:480px){.wd-un-cta .btn,.wd-ok .btn{width:100%}}

.wd-cta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:22px}
.wd-cta-ico{width:48px;height:48px;border-radius:15px;flex:none;display:flex;align-items:center;justify-content:center;background:#FEEBEB;color:#C13515}
.wd-cta-ico svg{width:24px;height:24px}
.wd-cta-txt{flex:1 1 220px;min-width:0}
.wd-cta-txt h4{font-size:15px}
.wd-cta-txt p{font-size:13px;color:var(--gray);margin-top:2px}
.feature-row .feature-item:last-child:nth-child(odd){grid-column:1/-1}
.gc-art .gc-badge svg{width:13px;height:13px;flex:none;filter:none}

/* ============================================================
   MODE SOMBRE — variables, bascule, corrections
   ============================================================ */
:root{
  --surface:#fff; --tint:#F5F9FF; --tint2:#EEF4FF; --track:#EDF2F9; --bd:#DCE5F2;
  --bd-amber:#F5E3B8; --bd-red:#F3C6BD; --bd-green:#BFEAD2;
  --text2:#44546B; --muted:#9AA7BB; --amber-ink:#7A5200; --red-ink:#8F2410; --green-ink:#0A6B45;
  --topbar-bg:rgba(247,250,252,.82); --overlay:rgba(255,255,255,.96);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1020; --surface:#121B2E; --navy:#E7EDF9; --gray:#9BA9C2; --line:#25324B; --line2:#1E2A42;
  --blue:#3D86FF; --blue-bg:#14294F; --green:#3DD68C; --green-bg:#0E2E22; --amber:#F2B04C; --amber-bg:#33270F;
  --red:#FF8068; --red-bg:#391A18;
  --tint:#16233C; --tint2:#183054; --track:#22304A; --bd:#2A3A58; --bd-amber:#5A4416; --bd-red:#5E2A24; --bd-green:#1F5A41;
  --text2:#B7C3D9; --muted:#7D8BA6; --amber-ink:#F5C26B; --red-ink:#FFA08E; --green-ink:#6EE0A8;
  --topbar-bg:rgba(10,16,32,.78); --overlay:rgba(10,16,32,.96);
  --sh:0 1px 2px rgba(0,0,0,.35),0 14px 34px -18px rgba(0,0,0,.65);
  --sh-lg:0 2px 6px rgba(0,0,0,.4),0 26px 52px -22px rgba(0,0,0,.75);
}
html[data-theme="dark"] body{background:var(--bg)}
/* éléments qui restent blancs en mode sombre (logo, QR code, boutons sur fond coloré) */
html[data-theme="dark"] .switch i::after,html[data-theme="dark"] .tb-logo,html[data-theme="dark"] .rf-solid,
html[data-theme="dark"] .rf-qrframe,html[data-theme="dark"] .wd-un-steps li.now .n,html[data-theme="dark"] .wd-ok-ico,
html[data-theme="dark"] .wd-un-cta .btn,html[data-theme="dark"] .wd-ok .btn{background:#fff}
html[data-theme="dark"] .rf-linkbox input{background:#fff;color:#10264B}
html[data-theme="dark"] .rf-solid{color:#1769FF}
html[data-theme="dark"] .btn-danger,html[data-theme="dark"] .adm-danger-solid{background:#D63D24;color:#fff}
html[data-theme="dark"] .btn-primary,html[data-theme="dark"] .ref-pill{color:#fff}
html[data-theme="dark"] .bnav-item.center,html[data-theme="dark"] .bnav-item.center.active{box-shadow:0 0 0 5px var(--surface),0 16px 26px -10px rgba(23,105,255,.6)}
html[data-theme="dark"] .bnav-item.center.active{box-shadow:0 0 0 5px var(--surface),0 0 0 8px rgba(61,134,255,.28),0 16px 26px -10px rgba(23,105,255,.7)}
html[data-theme="dark"] .bottomnav{box-shadow:0 10px 34px -8px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.4)}
html[data-theme="dark"] .modal-back,html[data-theme="dark"] .modal-overlay{background:rgba(2,6,16,.72)}
html[data-theme="dark"] ::placeholder{color:#6F7E9A}
html[data-theme="dark"] .input:-webkit-autofill{-webkit-box-shadow:0 0 0 40px #16233C inset;-webkit-text-fill-color:#E7EDF9}
/* fonds pastel écrits directement dans le HTML généré */
html[data-theme="dark"] [style*="background:#EAF1FF"]{background:rgba(61,134,255,.18)!important}
html[data-theme="dark"] [style*="background:#E6F8FF"]{background:rgba(0,184,255,.16)!important}
html[data-theme="dark"] [style*="background:#FFF4E0"],html[data-theme="dark"] [style*="background:#FFF4D6"],html[data-theme="dark"] [style*="background:#FDEEE3"]{background:rgba(242,176,76,.17)!important}
html[data-theme="dark"] [style*="background:#EAF9F0"]{background:rgba(61,214,140,.16)!important}
html[data-theme="dark"] [style*="background:#FEEBEB"]{background:rgba(255,128,104,.17)!important}
html[data-theme="dark"] [style*="background:#F0EDFF"]{background:rgba(139,115,255,.2)!important}
html[data-theme="dark"] [style*="background:#EEF2F8"],html[data-theme="dark"] [style*="background:#F4F7FB"]{background:var(--track)!important}
html[data-theme="dark"] [style*="background:#F5F9FF"]{background:var(--tint)!important}
html[data-theme="dark"] [style*="color:#B25E00"]{color:#F2B04C!important}
html[data-theme="dark"] [style*="color:#C13515"]{color:#FF8068!important}
html[data-theme="dark"] [style*="color:#0B9A57"]{color:#3DD68C!important}
html[data-theme="dark"] [style*="color:#C1652F"]{color:#F2995E!important}
html[data-theme="dark"] [style*="color:#0095D9"]{color:#33C4FF!important}
html[data-theme="dark"] [style*="color:#6B4EFF"]{color:#A998FF!important}
html[data-theme="dark"] [style*="color:#1769FF"]{color:#5B97FF!important}
html[data-theme="dark"] [style*="color:#44546B"]{color:var(--text2)!important}
html[data-theme="dark"] [style*="color:#667085"],html[data-theme="dark"] [style*="color:#93A1B5"]{color:var(--muted)!important}
html[data-theme="dark"] [style*="color:#8F2410"]{color:var(--red-ink)!important}
html[data-theme="dark"] [style*="color:#7A5200"]{color:var(--amber-ink)!important}
html[data-theme="dark"] [style*="border-color:#F3C6BD"]{border-color:var(--bd-red)!important}
html[data-theme="dark"] [style*="border-color:#F5E3B8"]{border-color:var(--bd-amber)!important}
/* bascule animée (désactivée si mouvement réduit) */
html.theme-anim,html.theme-anim *{transition:background-color .3s ease,color .3s ease,border-color .3s ease,box-shadow .3s ease!important}
html.reduce-motion.theme-anim,html.reduce-motion.theme-anim *{transition:none!important}
/* sélecteur d'apparence */
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:var(--track);border:1px solid var(--line)}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;background:transparent;color:var(--gray);font:inherit;font-size:12.5px;font-weight:800;padding:8px 12px;border-radius:10px;cursor:pointer;transition:.18s}
.seg button svg{width:15px;height:15px}
.seg button.on{background:var(--surface);color:var(--blue);box-shadow:0 2px 8px -2px rgba(16,38,75,.28)}
html[data-theme="dark"] .seg button.on{box-shadow:0 2px 10px -2px rgba(0,0,0,.6)}
.theme-row{flex-wrap:wrap;gap:12px}
@media(max-width:480px){.theme-row .seg{width:100%}.theme-row .seg button{flex:1}}
@media(max-width:350px){.theme-btn{display:none}}

/* ============================================================
   JEU DE CLICS
   ============================================================ */
.ck-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media(min-width:980px){.ck-layout{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}.ck-left{position:sticky;top:84px}}
.ck-left,.ck-right{min-width:0}
.ck-hud{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
.ck-hud .stat-tile .v{font-size:24px;overflow-wrap:anywhere}
.ck-off{margin-bottom:14px;align-items:center}
.ck-stage{padding:18px;display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 28%,var(--tint2) 0%,var(--surface) 62%)}
.ck-boosts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:30px}
.ck-bnone{font-size:12px;color:var(--muted);font-weight:600;align-self:center}
.ck-bchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#F79009,#FFB84D);box-shadow:0 8px 16px -8px rgba(247,144,9,.7);animation:popIn .25s ease both}
.ck-bchip svg{width:14px;height:14px}
.ck-bchip b{font-family:'Manrope',sans-serif;background:rgba(255,255,255,.28);padding:1px 8px;border-radius:999px}
.ck-orbwrap{position:relative;width:min(270px,72vw);aspect-ratio:1;user-select:none;-webkit-user-select:none}
.ck-orb{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;border:none;cursor:pointer;padding:0;touch-action:none;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle at 32% 26%,#7FD6FF 0%,#1769FF 46%,#0B2A7A 100%);
  box-shadow:inset 0 -14px 28px rgba(5,20,70,.55),inset 0 10px 22px rgba(255,255,255,.35),0 26px 50px -14px rgba(23,105,255,.7),0 0 0 8px rgba(23,105,255,.1);
  transition:transform .09s ease,box-shadow .09s ease;display:flex;align-items:center;justify-content:center}
.ck-orb:hover{box-shadow:inset 0 -14px 28px rgba(5,20,70,.55),inset 0 10px 22px rgba(255,255,255,.4),0 30px 56px -14px rgba(23,105,255,.8),0 0 0 10px rgba(23,105,255,.14)}
.ck-orb:active,.ck-orb.hit{transform:scale(.94)}
.ck-orb:focus-visible{outline:4px solid rgba(23,105,255,.45);outline-offset:6px}
.ck-orb.slow{filter:grayscale(.55) brightness(.9)}
.ck-halo{position:absolute;inset:-6px;border-radius:50%;border:3px solid rgba(0,184,255,.55);opacity:0;pointer-events:none}
.ck-orb.hit .ck-halo{animation:ckHalo .45s ease-out}
@keyframes ckHalo{0%{opacity:.9;transform:scale(.96)}100%{opacity:0;transform:scale(1.18)}}
.ck-orb-in{width:46%;aspect-ratio:1;border-radius:26%;background:#fff;padding:7%;display:flex;box-shadow:0 12px 24px -8px rgba(5,20,70,.6);pointer-events:none}
.ck-orb-in .brand-img{width:100%;height:100%;object-fit:contain}
.ck-floats{position:absolute;inset:0;pointer-events:none;overflow:visible}
.ck-float{position:absolute;transform:translate(-50%,-50%);font-family:'Manrope',sans-serif;font-weight:800;font-size:19px;white-space:nowrap;color:#1769FF;
  text-shadow:0 0 6px #fff,0 0 12px #fff,0 2px 10px rgba(23,105,255,.45);animation:ckFloat .85s ease-out forwards}
html[data-theme="dark"] .ck-float{color:#8FC0FF;text-shadow:0 0 8px #0A1020,0 0 14px #0A1020}
.ck-float.drop{font-size:16px;color:#F79009;animation-duration:1.3s;text-shadow:0 0 6px #fff,0 0 14px rgba(247,144,9,.6)}
.ck-float.drop.chest,.ck-float.drop.bolt{color:#12B886}
html[data-theme="dark"] .ck-float.drop{color:#FFC261;text-shadow:0 0 8px #0A1020}
@keyframes ckFloat{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-190%) scale(1.15)}}
.ck-combo{width:100%;max-width:340px}
.ck-combo-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--text2)}
.ck-combo-top span{display:flex;align-items:center;gap:5px}
.ck-combo-top svg{width:14px;height:14px;color:#F79009}
.ck-combo-top b{font-family:'Manrope',sans-serif;color:var(--navy)}
.ck-combo .progress{height:10px;margin-top:6px}
.ck-combo .progress i{background:linear-gradient(90deg,#00B8FF,#1769FF,#F79009);transition:width .1s linear}
.ck-hint{font-size:12px;color:var(--gray);text-align:center;max-width:360px}
.ck-tabs{margin-bottom:12px;flex-wrap:wrap}
.ck-tabs .chip{display:inline-flex;align-items:center;gap:6px}
.ck-tabs .chip svg{width:15px;height:15px}
.ck-shop{padding:6px 20px}
.ck-note{display:flex;gap:10px;align-items:flex-start;margin:14px 0 2px;padding:11px 13px;border-radius:14px;font-size:12.5px;color:var(--text2);background:var(--tint);border:1px solid var(--bd)}
.ck-note svg{width:16px;height:16px;flex:none;margin-top:1px;color:var(--blue)}
.ck-item{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid var(--line2)}
.ck-item:last-child{border-bottom:none}
.ck-item.locked{opacity:.7}
.ck-ico{width:46px;height:46px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--blue-bg);color:var(--blue)}
.ck-ico svg{width:22px;height:22px}
.ck-ico-b{background:var(--amber-bg);color:var(--amber)}
.ck-item.locked .ck-ico{background:var(--track);color:var(--muted)}
.ck-body{flex:1 1 160px;min-width:0}
.ck-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800;font-size:14.5px}
.ck-desc{font-size:12.5px;color:var(--gray);margin-top:2px}
.ck-eff{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--text2);margin-top:6px}
.ck-eff svg{width:13px;height:13px;color:var(--muted)}
.ck-eff b{color:var(--green);font-family:'Manrope',sans-serif}
.ck-live{display:inline-flex;align-items:center;gap:5px;color:#F79009}
.ck-live svg{width:13px;height:13px;color:#F79009}
.ck-cd{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.ck-buy{flex:none;min-width:104px;justify-content:center}
.ck-buy svg{width:15px;height:15px}
.ck-buy:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.ck-conv{padding:16px 0 18px}
.ck-conv-rate{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:16px;background:linear-gradient(120deg,var(--tint),var(--tint2));border:1px solid var(--bd)}
.ck-conv-rate>svg{width:24px;height:24px;color:var(--blue);flex:none}
.ck-conv-rate b{display:block;font-family:'Manrope',sans-serif;font-size:15px}
.ck-conv-rate small{display:block;font-size:12px;color:var(--gray);margin-top:2px}
.ck-conv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
.ck-conv-grid>div{padding:12px 14px;border-radius:14px;background:var(--tint);border:1px solid var(--bd)}
.ck-conv-grid small{display:block;font-size:11.5px;color:var(--gray);font-weight:700}
.ck-conv-grid b{font-family:'Manrope',sans-serif;font-size:22px;overflow-wrap:anywhere}
.ck-cap-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--text2);font-weight:600;flex-wrap:wrap}
.ck-cap-top b{font-family:'Manrope',sans-serif;color:var(--navy)}
.ck-rules p{font-size:13.5px;color:var(--text2);margin-bottom:10px;line-height:1.55}
.ck-rules b{display:inline-flex;align-items:center;gap:6px;color:var(--navy)}
.ck-rules svg{width:15px;height:15px;color:var(--blue)}
@media(max-width:480px){
  .ck-shop{padding:4px 16px}
  .ck-item{flex-wrap:wrap}
  .ck-buy{width:100%}
  .ck-hud .stat-tile .v{font-size:21px}
}
@media(prefers-reduced-motion:reduce){.ck-float,.ck-orb.hit .ck-halo,.ck-bchip{animation:none!important}.ck-orb{transition:none}}
</style>

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts"></div>

<script>
/* ================================================================
   MONELYX — Application CLIENT v1
   ----------------------------------------------------------------
   Architecture :
   1. CONFIG          — constantes applicatives (barèmes, caps…)
   2. STORE           — couche de données (tables identiques à Supabase)
   3. SERVICES        — Auth, Wallet, Games, Referral, Clicker…
   4. UI KIT          — toasts, modales, compteurs animés
   5. SHELL & ROUTEUR — navigation SPA sans rechargement
   6. VUES            — les 6 pages + auth + notifications
   7. MOTEURS DE JEUX — Runner / Memory / Puzzle / Challenge
   8. BOOT

   SCHEMA SUPABASE (à exécuter dans l'éditeur SQL Supabase) :
   ----------------------------------------------------------------
   create table public.profiles(id uuid pk references auth.users, nom text,
     prenom text, pseudo text unique, phone text, avatar_url text,
     email_verified bool default false, created_at timestamptz default now());
   create table public.wallets(user_id uuid pk references profiles,
     balance bigint default 0, pending bigint default 0,
     total_earned bigint default 0, account_no text, status text default 'actif',
     created_at timestamptz default now());
   create table public.wallet_transactions(id uuid pk default gen_random_uuid(),
     user_id uuid references profiles, type text, label text, amount bigint,
     status text default 'en attente', ref text, game_id text, meta jsonb,
     created_at timestamptz default now());
   create table public.games(id text pk, name text, tagline text, cat text);
   create table public.game_sessions(id uuid pk default gen_random_uuid(),
     user_id uuid, game_id text references games, score int, credits int,
     duration int, meta jsonb, created_at timestamptz default now());
   create table public.referrals(user_id uuid pk, code text unique,
     link text, invited int default 0, confirmed int default 0,
     verified int default 0, created_at timestamptz default now());
   create table public.referral_progress(user_id uuid, goal_id text,
     progress int default 0, completed bool default false, primary key(user_id,goal_id));
   create table public.referral_relations(id uuid pk default gen_random_uuid(),
     referrer_id uuid references profiles, referee_id uuid unique references profiles,
     code text, device_id text, same_device bool default false,
     created_at timestamptz default now(), check (referrer_id <> referee_id));
   -- referee_id UNIQUE : un filleul n'a jamais plus d'un parrain.
   -- ===== RETRAIT : tables + contrôles à exécuter CÔTÉ SERVEUR =====
   create table public.app_settings(key text primary key, value jsonb not null);
   create table public.withdraw_objectives(id uuid pk default gen_random_uuid(), title text not null, description text,
     type text not null, target int not null default 1, active bool default true, position int);
   create table public.unlock_payments(id uuid pk default gen_random_uuid(), user_id uuid references profiles,
     amount int not null, operator text, phone text, tx_ref text unique,
     status text default 'en attente' check (status in ('en attente','validé','refusé')), reason text,
     created_at timestamptz default now(), reviewed_at timestamptz, reviewed_by uuid);
   create table public.withdrawal_requests(id uuid pk default gen_random_uuid(), ref text unique, user_id uuid references profiles,
     amount int not null check (amount > 0), method text, phone text,
     status text default 'en attente' check (status in ('en attente','validé','refusé','payé')), reason text, snapshot jsonb,
     created_at timestamptz default now(), reviewed_at timestamptz, reviewed_by uuid, paid_at timestamptz);
   create unique index one_open_withdrawal on public.withdrawal_requests(user_id) where status in ('en attente','validé');
   -- RLS : AUCUN droit d'écriture direct pour le client sur wallets / withdrawal_requests / unlock_payments.
   -- Le client n'appelle que des fonctions SECURITY DEFINER :
   --   request_withdrawal(amount)  : vérifie retraits activés, frais de déblocage payés, objectifs validés, solde,
   --                                 minimum (1er retrait 1000 / suivants 8000) ; débite le portefeuille
   --                                 et insère la demande dans UNE seule transaction.
   --   submit_unlock_payment(...)  : insère un paiement 'en attente' (tx_ref unique).
   --   admin_review_withdrawal / admin_review_unlock : réservées au rôle admin ; un refus recrédite le solde.
   -- Jeu de clics : l'état de jeu est écrit par des fonctions serveur (anti-triche) ;
   -- la conversion points -> crédits débite les points et crédite le portefeuille dans UNE transaction,
   -- avec le plafond quotidien commun aux jeux.
   create table public.clicker_states(user_id uuid primary key references profiles,
     points numeric default 0, lifetime numeric default 0, clicks bigint default 0,
     upgrades jsonb default '{}', autos jsonb default '{}', boosts jsonb default '{}',
     updated_at timestamptz default now());
   create table public.notifications(id uuid pk default gen_random_uuid(),
     user_id uuid, title text, body text, category text, read bool default false,
     created_at timestamptz default now());
   create table public.support_requests(id uuid pk default gen_random_uuid(),
     user_id uuid, subject text, message text, status text default 'ouvert',
     created_at timestamptz default now());
   create table public.user_settings(user_id uuid pk, notif_email bool default true,
     notif_push bool default true, language text default 'fr', display text default 'confort',
     privacy_leaderboard bool default true);
   create table public.security_logs(id uuid pk default gen_random_uuid(),
     user_id uuid, event text, details text, created_at timestamptz default now());
   -- RLS : activer sur CHAQUE table + politique "auth.uid() = user_id" en lecture/écriture.
   -- Attribution de crédits : Edge Function (service role) uniquement — jamais depuis le client.
   ================================================================ */

/* ================= 2. STORE ================= */
const Store = {
  key:'monempire.db.v1', cache:null,
  read(){
    if(this.cache) return this.cache;
    const raw = localStorage.getItem(this.key);
    if(raw){ let parsed=null; try{ parsed=JSON.parse(raw); }catch(e){}
      if(parsed){ this.cache=parsed; this.migrate(); return this.cache; } }
    this.cache = this.seed(); this.write(); return this.cache;
  },
  /* Ajoute les nouvelles tables sans toucher aux données existantes */
